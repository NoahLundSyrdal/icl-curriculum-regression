name: Verify frozen study
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
      - name: Verify source, identities and raw selection
        run: python tools/verify_archive.py
      - name: Recompute all-seed review statistics
        run: python analysis/recompute_review.py data/confirmation_20261008.zip artifacts/review_recomputed.json
      - name: Check Python syntax
        run: python -m compileall -q experiments historical analysis tools
  scientific-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install CPU test runtime
        run: python -m pip install -r requirements-cpu.txt
      - name: Run original scientific unit tests
        working-directory: experiments/confirmation_20261008
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest -v test_confirmation test_robustness
